<!DOCTYPE html>
<html lang="en">
<head>

    <title>HTML Table</title>
</head>
<body>
    <h2>TAble Example</h2>
    <!-- root tag for table (3 * 2)-->

        <!-- table header -->
        <tr>
            <th>SN</th>
            <th>Name</th>
        </tr>
        <!-- table row -->
         <tr>
            <!-- table data -->
            <td>1.</td>
            <td>Ram</td>
         </tr>
         <tr>
            <td>1.</td>
            <td>Ram</td>
         </tr>
         <tr>
            <td>1.</td>
            <td>Ram</td>
         </tr>
    </table>
</body>
</html>
