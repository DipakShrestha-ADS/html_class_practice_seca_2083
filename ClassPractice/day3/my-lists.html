<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lists: Day 3</title>
</head>
<body>
    <h1>All Lists Example</h1>

    <h3>Ordered List</h3>
    <ol type="I" start="68">
        <!-- list item -->
        <li>A for Apple</li>
        <li>B for Ball</li>
        <li>C for Cat</li>
    </ol>
    <h3>Unordered List</h3>
    <ul type="square">
        <!-- type: default: disc, circle, square -->
        <li>A for Apple</li>
        <li>B for Ball</li>
        <li>C for Cat</li>
    </ul>
    <h3>Description List</h3>
    <!-- description list -->
    <dl>
        <!--dt: description title -->
        <dt>HTML</dt>
        <!--dd: description details -->
        <dd>Hypertext Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Stylesheet</dd>
        <dt>JS</dt>
        <dd>Javascript</dd>
    </dl>
</body>
</html>
